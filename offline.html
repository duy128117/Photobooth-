<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photobooth Offline</title>
    <meta name="theme-color" content="#101625" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(126, 199, 255, 0.2), transparent 28%),
          linear-gradient(180deg, #101625 0%, #0f1724 100%);
        color: #f6f1ec;
      }
      main {
        width: min(100%, 420px);
        padding: 28px;
        border-radius: 28px;
        background: rgba(20, 28, 42, 0.86);
        border: 1px solid rgba(220, 230, 244, 0.12);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 8vw, 40px);
      }
      p {
        margin: 0;
        line-height: 1.7;
        color: #b9c7da;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 16px;
        text-decoration: none;
        font-weight: 700;
        color: #101625;
        background: linear-gradient(135deg, #ff8d62, #ffb171);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Photobooth</h1>
      <p>Ban dang offline. Nhung phan da cache van mo duoc, con tinh nang can mang nhu dang nhap, luu project, va share se hoat dong lai khi co ket noi.</p>
      <a href="/photobooth.html">Mo editor offline</a>
    </main>
  </body>
</html>
