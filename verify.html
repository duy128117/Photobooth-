<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ảnh nhanh</title>
    <link rel="stylesheet" href="/assets/css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-orb auth-orb--one"></div>
      <div class="auth-orb auth-orb--two"></div>
      <div class="auth-orb auth-orb--three"></div>

      <main class="auth-layout">
        <section class="auth-hero">
          <p class="auth-kicker">Ảnh nhanh</p>
          <h1 class="auth-title">Ảnh nhanh</h1>
        </section>

        <section class="auth-card">
          <div class="auth-card__header">
            <p class="auth-kicker">Ảnh nhanh</p>
            <h2>Xac minh email</h2>
            <p id="verify-text" class="auth-subcopy">Đang xử lý...</p>
          </div>

          <div class="auth-actions">
            <a class="auth-link" href="/login.html">Ve dang nhap</a>
            <span id="verify-status" class="auth-status">Ảnh nhanh</span>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/assets/js/verify.js"></script>
  </body>
</html>
